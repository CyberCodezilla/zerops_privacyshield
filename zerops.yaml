zerops:
  - setup: api
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build --workspace=apps/api
      deployFiles:
        - apps/api/dist
        - apps/api/package.json
        - package.json
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start --workspace=apps/api
      envVariables:
        NER_SERVICE_URL: http://nerengine:8000

  - setup: web
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build --workspace=apps/web
      deployFiles:
        - apps/web/dist/~
    run:
      base: static

  - setup: nerengine
    build:
      base: python@3.11
      buildCommands:
        - python -m venv venv
        - . venv/bin/activate
        - pip install --no-cache-dir -r apps/ner-service/requirements.txt
      deployFiles:
        - apps/ner-service
        - venv
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: |
        . venv/bin/activate
        python -m uvicorn apps.ner-service.main:app --host 0.0.0.0 --port 8000