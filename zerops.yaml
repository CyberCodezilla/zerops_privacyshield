zerops:
  - setup: api
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build --workspace=apps/api
      deployFiles:
        - apps/api/dist/~
        - apps/api/package.json
        - package.json
    run:
      base: nodejs@20
      ports:
        - port: 3000
      start: node apps/api/dist/index.js

  - setup: web
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build --workspace=apps/web
      deployFiles:
        - apps/web/dist/~
    run:
      base: static

  - setup: ner-engine
    build:
      base: python@3.11
      buildCommands:
        - pip install -r apps/ner-service/requirements.txt
      deployFiles:
        - apps/ner-service/~
    run:
      base: python@3.11
      ports:
        - port: 8000
      start: uvicorn apps.ner-service.main:app --host 0.0.0.0 --port 8000
